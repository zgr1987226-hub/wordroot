<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173F34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="词根记词">
<meta name="format-detection" content="telephone=no">
<title>WordRoot · 词根记词</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#FAF8F4;--card:#fff;--ink:#1B1A17;--sub:#837C6E;--faint:#ADA697;
  --line:#ECE6DA;--green:#1E5C4A;--green-l:#2C7A63;--soft:#E9F1EC;
  --amber:#BE7F3C;--amber-soft:#FBF1E3;--red:#C0503C;--red-soft:#FBEAE7;
}
html,body{margin:0;padding:0;background:#EFEBE3;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
body{display:flex;justify-content:center;min-height:100vh;overscroll-behavior:none;
  -webkit-text-size-adjust:100%}
#app{width:100%;max-width:440px;height:100vh;height:100dvh;background:var(--paper);position:relative;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 60px rgba(50,40,20,.10);
  padding-top:env(safe-area-inset-top)}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(84px + env(safe-area-inset-bottom));
  scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
#view::-webkit-scrollbar{width:0}
.hidden{display:none!important}

/* ---------- tabbar ---------- */
#tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(70px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);display:flex;
  background:rgba(252,250,246,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:20}
.tb{flex:1;border:0;background:none;font-family:inherit;font-size:13px;color:var(--faint);touch-action:manipulation;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;position:relative}
.tb b{font-size:14px;font-weight:600;letter-spacing:1px}
.tb.active{color:var(--green)}
.tb.active:before{content:'';position:absolute;top:9px;width:22px;height:3px;border-radius:9px;background:var(--green)}
.tb span{font-size:10px;letter-spacing:.06em;opacity:.55}

/* ---------- generic ---------- */
.card{background:var(--card);border-radius:18px;padding:18px;margin:0 16px 12px;
  box-shadow:0 2px 12px rgba(60,50,30,.045);border:1px solid rgba(0,0,0,.025)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-h h3{margin:0;font-size:15px;font-weight:700;letter-spacing:.2px}
.card-h .more{font-size:12px;color:var(--faint)}
.sec{padding:22px 20px 8px;font-size:11.5px;letter-spacing:.14em;color:var(--faint);font-weight:600}
.btn{border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:600;font-family:inherit;
  background:var(--soft);color:var(--green);cursor:pointer;width:100%;transition:transform .12s;touch-action:manipulation}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,#2F7B65,#194F40);color:#F6F3EA;
  box-shadow:0 8px 22px rgba(25,79,64,.22)}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--sub);font-weight:500}
.btn.sm{padding:9px 14px;width:auto;font-size:13px;border-radius:11px}
.row{display:flex;gap:10px}
.chip{display:inline-block;padding:6px 12px;border-radius:99px;background:#F3EFE6;color:var(--sub);
  font-size:12px;margin:0 6px 6px 0;cursor:pointer;border:1px solid transparent}
.chip.on{background:var(--soft);color:var(--green);border-color:#CFE2D6;font-weight:600}
.serif{font-family:Georgia,'Times New Roman','Songti SC',serif}

/* ---------- segmented ---------- */
.segtabs{display:flex;background:#F0EBE0;border-radius:12px;padding:3px;margin:0 16px 12px}
.segtabs button{flex:1;border:0;background:none;font-family:inherit;font-size:13px;color:var(--sub);
  padding:9px 4px;border-radius:9px;cursor:pointer;transition:.15s}
.segtabs button.on{background:#fff;color:var(--green);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.06)}

/* ---------- 默写本 ---------- */
.dm-wrap{padding:4px 16px 0}
.dm-setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.dm-setrow:last-child{border:0}
.dm-setrow .lb{font-size:13.5px;color:var(--ink)}
.dm-setrow .lb small{display:block;font-size:11px;color:var(--faint);margin-top:3px}
.dm-setrow.col{flex-direction:column;align-items:flex-start;gap:2px}
.dm-setrow.col .dm-opts{justify-content:flex-start;margin-top:9px}
.dm-opts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.dm-opts button{border:1px solid var(--line);background:#fff;font-family:inherit;font-size:12px;
  color:var(--sub);padding:6px 11px;border-radius:9px;cursor:pointer}
.dm-opts button.on{background:var(--soft);border-color:#CFE2D6;color:var(--green);font-weight:700}

.dm-top{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.dm-top .ct{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.dm-bar{flex:1;height:5px;background:#E7E1D4;border-radius:9px;overflow:hidden}
.dm-bar i{display:block;height:100%;background:linear-gradient(90deg,#2C7A63,#1E5C4A);width:0;transition:width .3s}

.dm-card{background:#fff;border-radius:22px;padding:26px 20px 22px;margin-top:14px;text-align:center;
  box-shadow:0 8px 26px rgba(60,50,30,.07)}
.dm-cn{font-size:19px;font-weight:700;color:var(--green);line-height:1.5}
.dm-sub{font-size:12px;color:var(--faint);margin-top:8px}
.dm-hint{margin-top:16px;font-family:Georgia,serif;font-size:15px;color:var(--sub);letter-spacing:2px}
.dm-bigplay{width:82px;height:82px;border-radius:50%;border:0;margin:6px auto 0;display:block;
  background:var(--soft);color:var(--green);font-size:30px;cursor:pointer}
.dm-note{font-size:12px;color:var(--faint);margin-top:10px}
.dm-inp{width:100%;box-sizing:border-box;margin-top:16px;border:1.6px solid #E2DBCD;border-radius:14px;
  background:#FCFAF4;font-family:Georgia,serif;font-size:20px;letter-spacing:1.5px;color:var(--ink);
  padding:12px 14px;text-align:center;outline:none;transition:.15s}
.dm-inp:focus{border-color:#2C7A63;background:#fff}
.dm-diff{margin-top:14px;font-family:Georgia,serif;font-size:23px;letter-spacing:3px;line-height:1.5;word-break:break-all}
.dm-diff .g{color:var(--green)}
.dm-diff .b{color:var(--red);text-decoration:underline}
.dm-diff .k{color:var(--faint)}
.dm-act{display:flex;gap:8px;margin-top:14px}
.dm-act button{flex:1;border:1px solid var(--line);background:#FAF7F0;color:var(--green);font-family:inherit;
  font-size:13px;padding:11px;border-radius:12px;cursor:pointer;font-weight:600}

.dm-score{text-align:center;margin-top:16px;font-size:14px}
.dm-score b{display:block;font-size:18px;margin-bottom:4px}
.dm-score b.ok{color:var(--green)}
.dm-score b.no{color:var(--red)}

.dm-sum{text-align:center;padding:30px 20px 10px}
.dm-ring{width:140px;height:140px;border-radius:50%;margin:0 auto 16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#fff;background:linear-gradient(150deg,#2F7B65,#173F34);
  box-shadow:0 14px 34px rgba(25,79,64,.24)}
.dm-ring b{font-size:38px;font-family:Georgia,serif;line-height:1}
.dm-ring span{font-size:11px;opacity:.72;margin-top:6px}
.dm-wrong{background:#fff;border-radius:16px;padding:6px 16px;margin:16px 16px 0;box-shadow:0 2px 10px rgba(60,50,30,.05)}
.dm-wrong .it{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.dm-wrong .it:last-child{border:0}
.dm-wrong .it b{font-family:Georgia,serif;font-weight:400;color:var(--red);font-size:15px}
.dm-wrong .it span{font-size:12px;color:var(--sub)}

/* ---------- 句子阅读 ---------- */
.rd-head{padding:18px 20px 10px}
.rd-head h2{margin:0 0 6px;font-size:17px}
.rd-head p{margin:0;font-size:12px;color:var(--faint)}
.rd-card{background:#fff;border-radius:18px;padding:18px;margin:0 16px 12px;box-shadow:0 2px 12px rgba(60,50,30,.05)}
.rd-en{font-family:Georgia,serif;font-size:17.5px;line-height:1.8;color:#2B2922;margin:0}
.rd-en em{font-style:normal;color:var(--green);font-weight:700;border-bottom:1.5px solid #BFD5C9}
.rd-cn{font-size:12.5px;color:var(--sub);line-height:1.7;margin-top:9px;transition:.2s}
.rd-cn.blur{filter:blur(5px);opacity:.35;cursor:pointer;user-select:none}
.rd-tools{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.rd-tools button{border:1px solid var(--line);background:#FAF7F0;color:var(--green);font-family:inherit;
  font-size:12px;padding:8px 13px;border-radius:10px;cursor:pointer}
.rd-tools button.on{background:var(--soft);border-color:#CFE2D6;font-weight:700}
.rd-shadow{margin-top:10px;font-size:12px;color:var(--faint);min-height:16px;line-height:1.6}
.rd-more{display:block;margin:6px 16px 20px;width:calc(100% - 32px)}

/* ---------- home ---------- */
.hero{margin:14px 16px 6px;border-radius:24px;padding:20px 20px 18px;position:relative;overflow:hidden;
  background:linear-gradient(158deg,#28624F 0%,#173F34 68%,#12332B 100%);color:#F5F2E9;
  box-shadow:0 12px 30px rgba(20,60,48,.22)}
.hero:after{content:'';position:absolute;right:-56px;top:-76px;width:210px;height:210px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.16),transparent 68%)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
.hello{font-size:12px;opacity:.72;letter-spacing:.06em;margin-bottom:8px}
.hero h1{margin:0;font-size:25px;line-height:1.35;font-weight:600;letter-spacing:.4px}
.hero h1 em{font-style:normal;color:#EFCB8A;font-family:Georgia,serif;font-size:30px}
.streak{text-align:center;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.16);
  border-radius:14px;padding:8px 12px;min-width:62px}
.streak b{display:block;font-size:20px;font-family:Georgia,serif;line-height:1.1}
.streak span{font-size:10px;opacity:.7}
.hero-line{margin-top:18px;display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.hero-bar{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.hero-bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#EFCB8A,#F6E2BE);transition:width .5s}
.hero-line small{font-size:11.5px;opacity:.72;white-space:nowrap}

.stat3{display:flex;gap:10px;margin-bottom:16px}
.stat3>div{flex:1;text-align:center;background:#FAF7F0;border-radius:13px;padding:12px 6px}
.stat3 b{display:block;font-size:22px;font-family:Georgia,serif;color:var(--green);line-height:1.2}
.stat3 span{font-size:11px;color:var(--faint)}
.stat3 .warn b{color:var(--amber)}

/* bars */
.bars{display:flex;align-items:flex-end;gap:9px;height:92px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars .b i{width:100%;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#DCE9E2,#BFD5C9);transition:height .4s}
.bars .b i.today{background:linear-gradient(180deg,#2F7B65,#1B5142)}
.bars .b u{font-size:10px;color:var(--faint);text-decoration:none}
.bars .b em{font-size:10px;color:var(--green);font-style:normal;font-weight:700}

/* life card */
.life{background:linear-gradient(150deg,#FFFDF7,#FBF4E6);border:1px solid #F0E5CE}
.life-task{font-size:13.5px;line-height:1.72;color:#5C5341;margin:8px 0 14px}
.life-words{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.life-words span{background:#fff;border:1px solid #EFE3CB;border-radius:10px;padding:7px 11px;font-size:13px;
  font-family:Georgia,serif;color:#3F3A2E}

/* ---------- session ---------- */
#session{position:absolute;inset:0;background:var(--paper);z-index:60;display:none;flex-direction:column}
#session.show{display:flex}
.sess-top{padding:16px 16px 0;display:flex;align-items:center;gap:12px}
.sess-top button{border:0;background:none;font-size:22px;color:var(--faint);cursor:pointer;padding:0 4px;line-height:1;font-family:inherit}
.sess-prog{flex:1;height:6px;border-radius:99px;background:#E7E1D4;overflow:hidden}
.sess-prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2C7A63,#1E5C4A);width:0;transition:width .35s}
.sess-count{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.sess-body{flex:1;overflow-y:auto;padding:6px 18px 30px}

.wcard{background:#fff;border-radius:24px;padding:26px 22px 20px;margin-top:18px;text-align:center;
  box-shadow:0 8px 26px rgba(60,50,30,.07)}
.wcard .emo{font-size:40px;line-height:1;margin-bottom:8px;filter:saturate(.92)}
.wword{font-size:33px;line-height:1.15;letter-spacing:.6px;word-break:break-word}
.wipa{font-size:13px;color:var(--faint);margin-top:7px;font-family:Georgia,serif}
.wpos{display:inline-block;font-size:11px;color:var(--green);background:var(--soft);border-radius:6px;
  padding:2px 7px;margin-right:6px;vertical-align:2px}
.speak{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:8px 15px;border-radius:99px;
  background:var(--soft);color:var(--green);border:0;font-size:12.5px;font-family:inherit;cursor:pointer}
.zh{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);font-size:16px;font-weight:600;color:var(--green)}
.zh-sub{font-size:12.5px;color:var(--sub);font-weight:400;margin-top:6px}
.reveal{cursor:pointer}
.reveal .zh{display:none}
.reveal.on .zh{display:block}
.zh-hint{margin-top:16px;padding:14px;border:1px dashed #E2D8C2;border-radius:14px;text-align:center;
  font-size:12.5px;color:#B0843F;background:#FBF8F1;letter-spacing:.03em}

.morph-box{margin-top:16px;text-align:left}
.morph-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;justify-content:center}
.morph{background:#F4F0E5;border-radius:12px;padding:7px 11px;text-align:center}
.morph b{display:block;font-family:Georgia,serif;font-size:17px;color:#6B5F42;letter-spacing:.4px}
.morph small{display:block;font-size:10.5px;color:var(--faint);margin-top:2px}
.morph .op{color:var(--faint);font-size:14px;padding:0 1px}
.morph-tip{margin-top:10px;font-size:12px;color:var(--sub);line-height:1.7;text-align:center}

.ex-box{margin-top:16px;background:#FAF7F0;border-radius:14px;padding:14px;text-align:left}
.ex-box p{margin:0 0 6px;font-size:14px;line-height:1.65;font-family:Georgia,serif;color:#2C2A24}
.ex-box p span{color:var(--green);font-weight:700;border-bottom:1.5px solid #BFD5C9}
.ex-box small{font-size:12px;color:var(--sub);line-height:1.6;display:block}
.col-list{margin-top:12px;text-align:left}
.col-list div{font-size:12.5px;color:#4C4638;padding:7px 0;border-bottom:1px solid #F4EFE4;display:flex;justify-content:space-between;gap:10px}
.col-list div:last-child{border:0}
.col-list div b{font-family:Georgia,serif;font-weight:400;color:#2C2A24}

/* quiz */
.qtip{font-size:12px;letter-spacing:.1em;color:var(--faint);margin:22px 0 4px;text-align:center}
.qtitle{font-size:15px;text-align:center;color:var(--sub);margin:6px 0 18px}
.opt{width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;
  padding:14px 16px;font-size:15px;margin-bottom:10px;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:11px;color:var(--ink);transition:.15s}
.opt .idx{width:22px;height:22px;border-radius:50%;background:#F3EFE6;color:var(--faint);
  font-size:11px;display:flex;align-items:center;justify-content:center;flex:none}
.opt.ok{border-color:#2C7A63;background:var(--soft);color:var(--green);font-weight:600}
.opt.ok .idx{background:#2C7A63;color:#fff}
.opt.no{border-color:#D48878;background:var(--red-soft);color:var(--red)}
.opt.no .idx{background:var(--red);color:#fff}
.opt:disabled{cursor:default}

.dict-wrap{margin-top:20px}
.dict-hint{text-align:center;font-size:13px;color:var(--faint);margin-bottom:12px;letter-spacing:.04em}
.dict-hint b{font-family:Georgia,serif;color:var(--sub);letter-spacing:2px}
.dict{width:100%;font-size:23px;font-family:Georgia,serif;text-align:center;padding:15px 12px;
  border-radius:16px;border:1.5px solid var(--line);background:#fff;outline:none;letter-spacing:1.4px;color:var(--ink)}
.dict:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(44,122,99,.08)}
.dict.ok{border-color:#2C7A63;background:#F4FAF6}
.dict.no{border-color:#D48878;background:#FDF5F3}
.diff{margin-top:14px;font-family:Georgia,serif;font-size:19px;letter-spacing:1.5px;text-align:center;line-height:1.6}
.diff .c-ok{color:#2C7A63}
.diff .c-no{color:var(--red);text-decoration:underline;text-underline-offset:3px;text-decoration-style:wavy}

.res{text-align:center;margin-top:18px}
.res b{font-size:19px;display:block;margin-bottom:6px}
.res b.good{color:var(--green)}
.res b.bad{color:var(--red)}
.res small{font-size:12.5px;color:var(--sub);line-height:1.7}
.grade{display:flex;gap:10px;margin-top:18px}
.grade .btn{flex:1;padding:13px 6px}
.grade .btn.g1{background:var(--red-soft);color:var(--red)}
.grade .btn.g2{background:#FBF1E3;color:#9A6A2E}
.grade .btn.g3{background:#EDF4F0;color:var(--green)}
.grade .btn.g4{background:linear-gradient(135deg,#2F7B65,#194F40);color:#fff}

/* summary */
.sum-hero{text-align:center;padding:40px 20px 20px}
.sum-hero .ring{width:132px;height:132px;border-radius:50%;margin:0 auto 18px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(150deg,#2F7B65,#173F34);box-shadow:0 14px 34px rgba(25,79,64,.24)}
.sum-hero .ring b{font-size:34px;font-family:Georgia,serif;line-height:1}
.sum-hero .ring span{font-size:11px;opacity:.7;margin-top:6px}
.sum-hero h2{margin:0 0 8px;font-size:20px}
.sum-hero p{margin:0;font-size:13px;color:var(--sub)}
.sum-list{margin-top:22px}
.sum-list div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--sub)}
.sum-list div:last-child{border:0}
.sum-list div b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- roots ---------- */
.root-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px}
.root-card{background:#fff;border-radius:16px;padding:14px 14px 13px;box-shadow:0 2px 10px rgba(60,50,30,.045);
  cursor:pointer;border:1px solid rgba(0,0,0,.03);position:relative;overflow:hidden}
.root-card:after{content:attr(data-letter);position:absolute;right:6px;top:2px;font-family:Georgia,serif;
  font-size:26px;color:#F2EEE3}
.root-card b{font-family:Georgia,serif;font-size:18px;color:var(--green);letter-spacing:.5px;position:relative;z-index:2}
.root-card small{display:block;font-size:11.5px;color:var(--sub);margin-top:5px;position:relative;z-index:2}
.root-card i{display:block;font-size:10.5px;color:var(--faint);margin-top:9px;font-style:normal;position:relative;z-index:2}

/* ---------- word bank ---------- */
.search{display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid var(--line);
  border-radius:14px;padding:11px 14px;margin:0 16px 12px}
.search input{flex:1;border:0;outline:none;font-size:14px;font-family:inherit;background:none;color:var(--ink)}
.search input::placeholder{color:var(--faint)}
.wrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.wrow:last-child{border:0}
.wrow .l{flex:1;min-width:0}
.wrow .l b{font-family:Georgia,serif;font-size:16.5px;font-weight:400;letter-spacing:.3px}
.wrow .l small{display:block;font-size:11.5px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:10px;padding:3px 8px;border-radius:6px;white-space:nowrap;flex:none}
.badge.new{background:#F3EFE6;color:var(--faint)}
.badge.learning{background:var(--amber-soft);color:#9A6A2E}
.badge.review{background:var(--soft);color:var(--green)}
.badge.mastered{background:#E4EDE8;color:#1B4C3F;font-weight:700}

/* sheet */
#sheet{position:absolute;inset:0;z-index:80;display:none}
#sheet.show{display:block}
.mask{position:absolute;inset:0;background:rgba(20,18,12,.35);backdrop-filter:blur(2px)}
.sheet-body{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:24px 24px 0 0;
  padding:20px 20px 26px;max-height:86%;overflow-y:auto;animation:up .28s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet-handle{width:38px;height:4px;border-radius:9px;background:#DCD5C6;margin:-8px auto 16px}

/* heatmap */
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.heat i{aspect-ratio:1;border-radius:7px;background:#F1EDE3;display:block;position:relative}
.heat i.l1{background:#D8E7DE}
.heat i.l2{background:#A9CCBC}
.heat i.l3{background:#5B9C82}
.heat i.l4{background:#1B5142}
.legend{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--faint);margin-top:12px;justify-content:flex-end}

/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);gap:14px}
.set-row:last-child{border:0}
.set-row .t{font-size:14px}
.set-row .t small{display:block;font-size:11px;color:var(--faint);margin-top:3px}
.seg{display:flex;background:#F3EFE6;border-radius:10px;padding:3px}
.seg button{border:0;background:none;font-family:inherit;font-size:12px;color:var(--sub);padding:7px 11px;border-radius:8px;cursor:pointer}
.seg button.on{background:#fff;color:var(--green);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.note{font-size:12px;color:var(--sub);line-height:1.8}
.note b{color:var(--ink)}
</style>
</head>

/* =============== 存储 =============== */
var KEY = "wordroot_v1";
var S = load();

function load(){
  var d = null;
  try{ d = JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
  if(!d || typeof d!=="object" || !d.w){ d = {w:{},days:{},lifeDone:{},set:{newPerDay:15,engRatio:0.5,rate:0.9}}; }
  if(!d.set) d.set = {newPerDay:15,engRatio:0.5,rate:0.9};
  if(!d.days) d.days = {};
  if(!d.lifeDone) d.lifeDone = {};
  if(!d.readDone) d.readDone = {};
  if(typeof d.cursor!=="number") d.cursor = 0;
  return d;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function pad(n){ return n<10 ? "0"+n : ""+n; }
function dkey(d){ d = d||new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function dparse(k){ var p=k.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(k,n){ var d=dparse(k); d.setDate(d.getDate()+n); return dkey(d); }
function daysBetween(a,b){ return Math.round((dparse(b)-dparse(a))/86400000); }
function today(){ return dkey(); }

function st(w){
  if(!S.w[w]) S.w[w] = {state:"new", ef:2.5, reps:0, interval:0, due:null, lapses:0, times:0, lastQ:null, first:null};
  return S.w[w];
}
function isNew(w){ var s=S.w[w]; return !s || s.state==="new"; }
function isDue(w){
  var s=S.w[w];
  return !!s && s.state!=="new" && s.due && s.due<=today();
}
function dueList(){
  var t = today(), out = [];
  Object.keys(S.w).forEach(function(k){
    var s = S.w[k];
    if(!BY_W[k] || s.state==="new" || !s.due || s.due>t) return;
    out.push(BY_W[k]);
  });
  out.sort(function(a,b){ return (S.w[a.w].due||"").localeCompare(S.w[b.w].due||""); });
  return out;
}
function learnedKeys(){
  return Object.keys(S.w).filter(function(k){
    return BY_W[k] && S.w[k].state!=="new";
  });
}

/* ---- SM-2 变体 ---- */
function grade(w, q){
  var s = st(w);
  s.times = (s.times||0)+1;
  s.lastQ = q;
  if(!s.first) s.first = today();
  if(q < 3){
    s.lapses++;
    s.reps = 0;
    s.interval = 1;
    s.ef = Math.max(1.3, s.ef - 0.2);
    s.state = "learning";
    s.due = addDays(today(), 1);
  }else{
    s.reps++;
    if(s.reps === 1) s.interval = 1;
    else if(s.reps === 2) s.interval = 3;
    else s.interval = Math.round(s.interval * s.ef);
    s.ef = Math.max(1.3, s.ef + (0.1 - (5-q)*(0.08 + (5-q)*0.02)));
    s.state = s.interval >= 21 ? "mastered" : "review";
    s.due = addDays(today(), s.interval);
  }
  save();
  return s;
}

/* ---- 每日统计 ---- */
function dayStat(k){
  k = k || today();
  if(!S.days[k]) S.days[k] = {neu:0, rev:0, ok:0, bad:0};
  return S.days[k];
}
function streak(){
  var n = 0, k = today();
  var ds = S.days;
  if(ds[k] && (ds[k].neu+ds[k].rev>0)) n = 0;
  var start = (ds[k] && (ds[k].neu+ds[k].rev>0)) ? k : addDays(k,-1);
  var cur = start;
  while(ds[cur] && (ds[cur].neu+ds[cur].rev>0)){ n++; cur = addDays(cur,-1); }
  return n;
}
function masteredCount(){
  return Object.keys(S.w).filter(function(k){ return BY_W[k] && S.w[k].state==="mastered"; }).length;
}
function learnedCount(){ return learnedKeys().length; }

function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function norm(s){ return (s||"").toLowerCase().replace(/[^a-z]/g,""); }
function tts(text, rate, onend){
  var ss = (typeof window !== "undefined") ? window.speechSynthesis : null;
  if(!ss || typeof SpeechSynthesisUtterance === "undefined"){
    if(onend) setTimeout(onend, 900);
    return;
  }
  try{
    ss.cancel();
    try{ ss.resume(); }catch(e){}
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = rate || S.set.rate || 0.9;
    var vs = (ss.getVoices ? ss.getVoices() : []) || [];
    for(var i=0;i<vs.length;i++){
      if(/^en([-_]|$)/i.test(vs[i].lang || "")){ u.voice = vs[i]; break; }
    }
    if(onend) u.onend = onend;
    /* iOS Safari 上 cancel() 之后立刻 speak() 常被丢掉，隔一拍再说 */

  }catch(e){ if(onend) setTimeout(onend, 900); }
}

function curveSVG(){
  var x0=18, x1=312, y0=20, y1=104;
  var segs=[0,1,3,7,15,30], seg=(x1-x0)/(segs.length-1);
  var decay=[2.1,1.7,1.35,1.05,0.8], d="";
  for(var i=0;i<segs.length-1;i++){
    var bx=x0+i*seg, k=decay[i];
    for(var j=0;j<=8;j++){
      var r=Math.exp(-k*j/8);
      d += (i===0&&j===0?"M":"L")+(bx+j/8*seg).toFixed(1)+" "+(y0+(1-r)*(y1-y0)).toFixed(1)+" ";
    }
  }
  var svg='<svg viewBox="0 0 330 132" style="width:100%;height:auto;display:block">';
  svg += '<line x1="18" y1="104" x2="312" y2="104" stroke="#E9E3D5" stroke-width="1"/>';
  segs.forEach(function(s,i){
    var px = x0+i*seg;
    svg += '<line x1="'+px.toFixed(1)+'" y1="20" x2="'+px.toFixed(1)+'" y2="104" stroke="#EDE6D7" stroke-dasharray="2 3"/>';
  });
  svg += '<path d="'+d+'" fill="none" stroke="#2C7A63" stroke-width="2.4" stroke-linejoin="round"/>';
  segs.forEach(function(s,i){
    var px = x0+i*seg;
    svg += '<circle cx="'+px.toFixed(1)+'" cy="20" r="3.2" fill="'+(i? "#BE7F3C":"#2C7A63")+'"/>';
    svg += '<text x="'+px.toFixed(1)+'" y="122" font-size="9.5" fill="#ADA697" text-anchor="middle">'+(i===0?"学习":"+"+s+" 天")+'</text>';
  });
  svg += '</svg>';
  return svg;
}

  CORE.forEach(function(x){ if(isNew(x.w)) (x.topic==="工程"?eng:life).push(x); });
  shuffle(eng); shuffle(life);
  while(out.length<n && (eng.length||life.length) && guard++<300){
    var wantEng = Math.random() < r;
    var arr = wantEng ? eng : life;
    if(!arr.length) arr = wantEng ? life : eng;
    if(!arr.length) break;
    out.push(arr.shift());
  }

  /* 2) 精讲词学完，进入 5 万词库，按词频从简到难推进 */
  var i = S.cursor || 0;
  if(i < CORE.length) i = CORE.length;
  while(out.length<n && i<BANK.length){
    var x = BANK[i++];
    if(isNew(x.w)){
      var s0 = st(x.w); s0.state = "learning"; s0.due = today();
      out.push(x);
    }
  }
  S.cursor = i;
  save();
  return out;
}

function startSession(mode){
  var ds = dayStat(today());
  var due = (mode==="new") ? [] : dueList().slice(0,50);
  var leftNew = Math.max(0, S.set.newPerDay - ds.neu);
  var news = (mode==="rev") ? [] : pickNew(mode==="new" ? Math.max(leftNew,5) : leftNew);
  if(!due.length && !news.length){
    alert("今天的词已经过完了。可以去「词库」挑几个提前学，或者明天再来。");
    return;
  }
  var queue=[], di=0, ni=0;
  while(di<due.length || ni<news.length){
    for(var k=0;k<2 && di<due.length;k++) queue.push({w:due[di++].w, kind:"rev", phase:"quiz", tries:0});
    if(ni<news.length) queue.push({w:news[ni++].w, kind:"new", phase:"learn", tries:0});
  }
  sess = {queue:queue, i:0, ok:0, bad:0, q:null, graded:{}, requeued:{}};
  document.getElementById("session").innerHTML = "";
  document.getElementById("session").classList.add("show");
  prepare();
}

function exitSession(){
  sess = null;
  var el = document.getElementById("session");
  el.classList.remove("show"); el.innerHTML="";
  render();
}

function prepare(){
  if(!sess) return;
  var it = sess.queue[sess.i];
  if(!it){ renderSummary(); return; }
  var w = BY_W[it.w];
  if(it.phase==="learn"){ sess.q = {type:"learn", w:w.w}; }
  else {
    var type = (it.tries>0) ? "dict" : pickType(w);
    sess.q = makeQ(w, type);
  }
  paint();
}

function pickType(w){
  var s = S.w[w.w] || {};
  var list = ["meaning","dict","cloze"];
  if(w.roots && w.roots.length>=2) list.push("roots");
  if(s.state==="mastered"){ list.push("dict"); list.push("dict"); }
  var t = list[Math.floor(Math.random()*list.length)];
  if(t==="cloze" && !canBlank(w)) t="meaning";
  return t;
}

function canBlank(w){ return blankOf(w) !== null; }

function blankOf(w){
  var en = w.ex || "";
  var i = en.toLowerCase().indexOf(w.w.toLowerCase());
  if(i<0) return null;
  var s=i, e=i+w.w.length;
  while(s>0 && /[A-Za-z\-]/.test(en.charAt(s-1))) s--;
  while(e<en.length && /[A-Za-z\-]/.test(en.charAt(e))) e++;
  return esc(en.slice(0,s)) + '<span style="color:#BE7F3C;letter-spacing:3px;border-bottom:1.5px solid #D9C69E">______</span>' + esc(en.slice(e));
}

function distract(w, getter, n){
  n = n || 3;
  var seen = {}, out = [], tries = 0;
  seen[getter(w)] = 1;
  var hot = Math.min(BANK.length, 4000);
  while(out.length<n && tries<700){
    tries++;
    var idx = tries<350 ? Math.floor(Math.random()*hot) : Math.floor(Math.random()*BANK.length);
    var x = BANK[idx];
    if(!x || x.w === w.w) continue;
    var v = getter(x);
    if(!v || seen[v] || v.length > 42) continue;
    seen[v] = 1; out.push(v);
  }
  return out;
}

function makeQ(w, type){
  var q = {type:type, w:w.w, answered:false, opts:[], ans:0, pick:-1, typed:"", correct:false};
  if(type==="dict") return q;
  var correct, opts;
  if(type==="cloze"){
    correct = w.w;
    opts = distract(w, function(x){ return x.w; });
    q.blank = blankOf(w);
  }else{
    correct = w.cn;
    opts = distract(w, function(x){ return x.cn; });
  }
  opts.push(correct);
  shuffle(opts);
  q.opts = opts;
  q.ans = opts.indexOf(correct);
  return q;
}

function answer(i){
  var q = sess.q;
  if(!q || q.answered) return;
  q.answered = true; q.pick = i;
  q.correct = (i === q.ans);
  if(q.correct) sess.ok++; else sess.bad++;
  var ds = dayStat(); if(q.correct) ds.ok++; else ds.bad++;
  save();
  paint();
}

function submitDict(){
  var q = sess.q;
  if(!q || q.answered || q.type!=="dict") return;
  var inp = document.getElementById("dictInput");
  var val = inp ? inp.value : "";
  q.typed = val;
  q.answered = true;
  q.correct = (norm(val) === norm(q.w));
  if(q.correct) sess.ok++; else sess.bad++;
  var ds = dayStat(); if(q.correct) ds.ok++; else ds.bad++;
  save();
  paint();
}

function toQuiz(){
  var it = sess.queue[sess.i];
  it.phase = "quiz";
  prepare();
}

function predict(s, q){
  if(q < 3) return 1;
  var rep = (s.reps||0)+1, ef = s.ef, ni;
  if(rep===1) ni=1; else if(rep===2) ni=3;
  else {
    ef = Math.max(1.3, ef + (0.1-(5-q)*(0.08+(5-q)*0.02)));
    ni = Math.round((s.interval||1) * ef);
  }
  return ni;
}

function doGrade(qv){
  var it = sess.queue[sess.i];
  if(!it) return;
  var name = it.w;
  var first = (st(name).times === 0);
  grade(name, qv);
  if(first) dayStat().neu++; else dayStat().rev++;
  sess.graded[name] = 1;
  if(qv < 3 && !sess.requeued[name]){
    sess.requeued[name] = 1;
    sess.queue.push({w:name, kind:"rev", phase:"learn", tries:1});
  }
  sess.i++;
  prepare();
}

function exHi(w){
  try{
    var re = new RegExp(w.w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi");
    return esc(w.ex).replace(re, function(m){ return '<span>'+m+'</span>'; });
  }catch(e){ return esc(w.ex); }
}

function morphRow(w, mode){
  var h = '<div class="morph-line">';
  w.roots.forEach(function(m, i){
    if(i) h += '<span class="op">+</span>';
    h += '<span class="morph"><b>'+esc(m.p)+'</b><small>'+esc(m.m)+'</small></span>';
  });
  if(mode==="full" && w.cn.length<=7){
    h += '<span class="op">=</span><span class="morph" style="background:#E4EEE7"><b>'+esc(w.cn)+'</b><small>词义</small></span>';
  }else if(mode==="guess"){
    h += '<span class="op">=</span><span class="morph" style="background:#FBF1E3"><b>?</b><small>你来猜</small></span>';
  }
  h += '</div>';
  return h;
}

/* ---- 渲染 ---- */
function paint(){
  if(!sess) return;
  var it = sess.queue[sess.i];
  var el = document.getElementById("session");
  if(!it){ renderSummary(); return; }
  var q = sess.q;
  var total = sess.queue.length;
  var pct = Math.round(sess.i/total*100);
  var head = '<div class="sess-top"><button onclick="exitSession()">✕</button>'
    + '<div class="sess-prog"><i style="width:'+pct+'%"></i></div>'
    + '<span class="sess-count">'+Math.min(sess.i+1,total)+'/'+total+'</span></div>';
  el.innerHTML = head + '<div class="sess-body">' + bodyOf(it, q) + '</div>';
  if(q && q.type==="dict" && !q.answered){
    var inp = document.getElementById("dictInput");
    if(inp) setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 80);
  }
}

function bodyOf(it, q){
  var w = BY_W[it.w];
  if(!q) return "";
  if(q.type==="learn") return learnHTML(w);
  if(!q.answered) return quizHTML(q);
  return feedbackHTML(q, w);
}

function learnHTML(w){
  var fresh = !(S.w[w.w] && S.w[w.w].times);
  var meta = [w.pos, w.curated ? w.topic : (tagLabel(w.tag)||"通用词库")].filter(Boolean).join(" · ");
  var h = '<div class="qtip">'+(S.w[w.w] && S.w[w.w].times ? "再见一次 · 重新建立画面" : "新词 · 先建立画面")+'</div>'
    + '<div class="wcard">'
    + (w.emoji ? '<div class="emo">'+w.emoji+'</div>' : '<div class="emo" style="font-size:26px;opacity:.35">🔤</div>')
    + '<div class="wword serif">'+esc(w.w)+'</div><div class="wipa">'+esc(w.ipa)+'</div>'
    + (w.curated ? '' : '<div style="margin-top:8px"><span class="badge learning">'+(tagLabel(w.tag)||"通用")+'</span></div>')
    + '<button class="speak" onclick="speakWord(\''+w.w+'\')">🔊 听一遍</button>';
  if(w.ex){
    h += '<div class="ex-box" style="margin-top:18px"><p>'+exHi(w)+'</p><small>'+esc(w.excn)+'</small>'
      + '<button class="speak" style="margin-top:10px" onclick="speakSent(\''+w.ex.replace(/'/g,"\\'")+'\')">🔊 整句朗读</button></div>';
  }
  if(w.roots.length){
    h += '<div class="morph-box">'+morphRow(w, fresh ? "guess" : "full")
      + '<div class="morph-tip">先记词根，再拼词义 —— 下次遇到没见过的词也能猜个七八分</div></div>';
  }
  var zhBlock = '<div class="zh">'+esc(w.cn)+'<div class="zh-sub">'+esc(meta)+'</div></div>';
  h += fresh
    ? '<div class="reveal" onclick="this.classList.add(\'on\')"><div class="zh-hint">先看英文和例句猜一猜 · 点这里揭示释义</div>'+zhBlock+'</div>'
    : zhBlock;
  if(w.col.length){
    h += '<div class="col-list">';
    w.col.forEach(function(c){
      var en = c.replace(/[^A-Za-z\-\s]/g,"").trim();
      var zh = c.replace(en,"").trim();
      h += '<div><b>'+esc(en)+'</b><span style="color:var(--sub)">'+esc(zh)+'</span></div>';
    });
    h += '</div>';
  }
  h += '</div><button class="btn primary" style="margin-top:4px" onclick="toQuiz()">看懂了，去检验</button>';
  return h;
}

function quizHTML(q){
  var w = BY_W[q.w];
  var h = "";
  if(q.type==="meaning"){
    h += '<div class="qtip">看词选义</div>'
      + '<div class="wcard" style="padding:26px 20px"><div class="wword serif">'+esc(w.w)+'</div>'
      + '<div class="wipa">'+esc(w.ipa)+'</div>'
      + '<button class="speak" onclick="speakWord(\''+w.w+'\')">🔊 听发音</button></div>'
      + '<div class="qtitle">这个词的意思是</div>';
  } else if(q.type==="cloze"){
    h += '<div class="qtip">语境填空</div>'
      + '<div class="wcard" style="text-align:left;padding:20px">'
      + '<p style="font-family:Georgia,serif;font-size:16px;line-height:1.9;margin:0;color:#2C2A24">'+q.blank+'</p>'
      + '<p style="margin:12px 0 0;font-size:12.5px;color:var(--sub);line-height:1.7">'+esc(w.excn)+'</p></div>'
      + '<div class="qtitle">空格处最合适的词是<small style="color:var(--faint)"> （按原形选）</small></div>';
  } else if(q.type==="roots"){
    h += '<div class="qtip">词根推理</div>'
      + '<div class="wcard" style="padding:22px 16px"><div class="wword serif" style="font-size:26px">'+esc(w.w)+'</div>'
      + '<div class="morph-box">'+morphRow(w, "none")+'</div>'
      + '<div class="morph-tip">把上面几块拼起来，猜它的意思</div></div>'
      + '<div class="qtitle">它最可能的意思是</div>';
  } else if(q.type==="dict"){
    h += '<div class="qtip">默写 · 这一步才算真会</div>'
      + '<div class="wcard" style="padding:24px 20px"><div class="zh" style="margin:0;border:0;padding:0">'+esc(w.cn)+'</div>'
      + '<div class="zh-sub">'+esc(w.pos)+' · '+w.topic+'</div>'
      + '<div class="dict-hint" style="margin-top:18px"><b>'+hintOf(w.w)+'</b></div>'
      + '<button class="speak" onclick="speakWord(\''+w.w+'\')" style="margin-top:4px">🔊 听它的发音</button></div>'
      + '<div class="dict-wrap"><input id="dictInput" class="dict" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="在这里默写" onkeydown="if(event.key===\'Enter\'){submitDict()}">'
      + '<button class="btn primary" style="margin-top:14px" onclick="submitDict()">提交</button></div>';
    return h;
  }
  h += optionsHTML(q);
  return h;
}

function optionsHTML(q){
  var h = "";
  q.opts.forEach(function(o, i){
    h += '<button class="opt" onclick="answer('+i+')"><span class="idx">'+"ABCD".charAt(i)+'</span><span>'+esc(o)+'</span></button>';
  });
  return h;
}

function diffHTML(typed, ans){
  var out = "";
  for(var i=0;i<Math.max(typed.length, ans.length);i++){
    var a = ans.charAt(i), b = typed.charAt(i);
    if(!a) continue;
    out += '<span class="'+(b===a?"c-ok":"c-no")+'">'+a+'</span>';
  }
  return '<div class="diff">'+out+'</div>'
    + '<div style="text-align:center;font-size:12px;color:var(--faint);margin-top:4px">你写的：'+esc(typed||"（空）")+'</div>';
}

function feedbackHTML(q, w){
  var ok = q.correct;
  var s = st(w.w);
  var h = '<div class="res"><b class="'+(ok?"good":"bad")+'">'+(ok ? "✓ 答对了" : (q.type==="dict" ? "✗ 拼写没对上" : "✗ 选错了"))+'</b>';
  if(!ok) h += '<small>正确答案：<b style="font-family:Georgia,serif;font-size:15px;color:#1B5142">'+esc(w.w)+'</b></small>';
  h += '</div>';

  if(q.type==="dict") h += diffHTML(q.typed, w.w);

  h += '<div class="wcard" style="text-align:left;padding:20px;margin-top:16px">'
    + '<div style="display:flex;align-items:center;justify-content:space-between">'
    + '<div><div class="wword serif" style="font-size:23px;text-align:left">'+esc(w.w)+'</div>'
    + '<div class="wipa">'+esc([w.ipa, w.pos, w.curated ? w.topic : tagLabel(w.tag)].filter(Boolean).join(" · "))+'</div></div>'
    + '<button class="speak" style="margin:0" onclick="speakWord(\''+w.w+'\')">🔊</button></div>'
    + '<div style="font-size:15px;font-weight:600;color:var(--green);margin-top:12px">'+esc(w.cn)+'</div>';
  if(w.roots.length) h += '<div class="morph-box">'+morphRow(w, "none")+'</div>';
  if(w.ex) h += '<div class="ex-box" style="margin-top:12px"><p>'+exHi(w)+'</p><small>'+esc(w.excn)+'</small>'
    + '<button class="speak" style="margin-top:8px" onclick="speakSent(\''+w.ex.replace(/'/g,"\\'")+'\')">🔊 整句朗读</button></div>';
  h += '</div>';

  var p1 = predict(s, ok ? 4 : 1), p2 = predict(s, ok ? 5 : 2);
  h += '<div class="qtip" style="margin-top:18px">这次记得有多牢</div>';
  h += '<div class="grade">';
  if(ok){
    h += '<button class="btn g3" onclick="doGrade(4)">记得<small style="display:block;font-size:10.5px;opacity:.7;font-weight:400;margin-top:3px">'+p1+' 天后复习</small></button>'
      + '<button class="btn g4" onclick="doGrade(5)">很熟<small style="display:block;font-size:10.5px;opacity:.75;font-weight:400;margin-top:3px">'+p2+' 天后复习</small></button>';
  }else{
    h += '<button class="btn g1" onclick="doGrade(1)">忘了<small style="display:block;font-size:10.5px;opacity:.7;font-weight:400;margin-top:3px">本轮再来一遍</small></button>'
      + '<button class="btn g2" onclick="doGrade(2)">有点印象<small style="display:block;font-size:10.5px;opacity:.7;font-weight:400;margin-top:3px">明天再见</small></button>';
  }
  h += '</div>';
  return h;
}

function renderSummary(){
  var total = sess.ok + sess.bad;
  var acc = total ? Math.round(sess.ok/total*100) : 0;
  var uniq = Object.keys(sess.graded).length;
  var ds = dayStat();
  var leftDue = dueList().length;
  var leftNew = Math.max(0, S.set.newPerDay - ds.neu);
  var title = acc>=85 ? "这轮很扎实" : acc>=65 ? "基本记住了" : "有点吃力，明天再来一遍";
  var el = document.getElementById("session");
  el.innerHTML = '<div class="sess-top"><button onclick="exitSession()">✕</button>'
    + '<div class="sess-prog"><i style="width:100%"></i></div><span class="sess-count">完成</span></div>'
    + '<div class="sess-body"><div class="sum-hero">'
    + '<div class="ring"><b>'+acc+'%</b><span>本轮正确率</span></div>'
    + '<h2>'+title+'</h2><p>'+uniq+' 个词过了今天这一关</p></div>'
    + '<div class="card sum-list">'
    + '<div><span>本轮答对 / 答错</span><b>'+sess.ok+' / '+sess.bad+'</b></div>'
    + '<div><span>今天累计学习</span><b>'+(ds.neu+ds.rev)+' 词</b></div>'
    + '<div><span>今天新学</span><b>'+ds.neu+' 词</b></div>'
    + '<div><span>还剩待复习</span><b>'+leftDue+' 词</b></div>'
    + '<div><span>词库已掌握</span><b>'+masteredCount()+' / '+BANK.length+'</b></div></div>'
    + '<div class="card life"><div class="card-h"><h3>别忘了把它用出去</h3></div>'
    + '<div class="note">今天挑 3 个刚学的词，各造一句和你自己生活有关的句子（写在手机备忘录里就行）。能造句，才算真的会。</div></div>'
    + '<div class="row" style="margin:0 16px 12px">'
    + (leftDue||leftNew ? '<button class="btn primary" style="flex:1" onclick="startSession(\'mix\')">再来一轮</button>' : '')
    + '<button class="btn ghost" style="flex:1" onclick="exitSession()">回首页</button></div></div>';
}

/* =============== 默写本 =============== */
var DM_SCOPES = [["today","今日"],["due","待复习"],["learned","已学"],["core","精讲"],["bank","词库"]];
var DM_NS = [[10,"10 题"],[20,"20 题"],[30,"30 题"]];
var DM_MODES = [["cn","看中文默写"],["audio","听音默写"]];
var dm = {open:false, scope:"today", n:10, mode:"cn", hint:true, list:[], i:0, typed:"", answered:false, right:false, done:false, wrong:[], ok:0};

function dmPool(){
  var t = today(), out = [];
  if(dm.scope==="today"){
    Object.keys(S.w).forEach(function(k){ if(BY_W[k] && S.w[k].first===t) out.push(BY_W[k]); });
  }else if(dm.scope==="due"){
    out = dueList();
  }else if(dm.scope==="learned"){
    learnedKeys().forEach(function(k){ out.push(BY_W[k]); });
  }else if(dm.scope==="core"){
    out = CORE.slice();
  }else{
    var lim = Math.min(BANK.length, 9000), n = Math.min(lim, dm.n*5);
    for(var i=0;i<n;i++) out.push(BANK[Math.floor(Math.random()*lim)]);
  }
  return out.filter(function(x){ return x && x.w; });
}
function dmAvail(){ return dm.scope==="bank" ? Math.max(0, Math.min(BANK.length,9000)) : dmPool().length; }

function dmOpts(opts, cur, fn){
  return opts.map(function(o){
    return '<button class="'+(cur===o[0]?"on":"")+'" onclick="'+fn+'(\''+o[0]+'\')">'+o[1]+'</button>';
  }).join("");
}
function renderDmSetup(){
  var avail = dmAvail();
  var h = '<div class="dm-wrap">'
    + '<div class="rd-head" style="padding:14px 4px 6px"><h2>默写本</h2><p>看中文写英文 / 听发音写英文 —— 能默出来，才算真的记住</p></div>'
    + '<div class="card" style="padding:2px 16px">'
    + '<div class="dm-setrow col"><div class="lb">默写范围<small>今日＝今天新学的词，精讲＝带词根的 98 词</small></div><div class="dm-opts">'+dmOpts(DM_SCOPES, dm.scope, "setDmScope")+'</div></div>'
    + '<div class="dm-setrow"><div class="lb">题量<small>一次 10 题左右最不容易厌</small></div><div class="dm-opts">'+dmOpts(DM_NS, dm.n, "setDmN")+'</div></div>'
    + '<div class="dm-setrow"><div class="lb">默写方式<small>听音默写时只给发音，难度更高</small></div><div class="dm-opts">'+dmOpts(DM_MODES, dm.mode, "setDmMode")+'</div></div>'
    + '<div class="dm-setrow"><div class="lb">首字母提示<small>给首字母，其余用横线</small></div><div class="dm-opts">'
    + '<button class="'+(dm.hint?"on":"")+'" onclick="toggleDmHint()">'+(dm.hint?"开":"关")+'</button></div></div>'
    + '</div>'
    + '<div class="card" style="margin-top:12px"><div class="note">这个范围里可选 <b>'+avail+'</b> 个词'
    + (dm.scope==="bank" ? '（从 5 万词库的高频段随机抽，不会抽到太冷僻的）' : '')
    + (avail===0 ? '。先去首页学几个词，或者把范围改成「精讲 / 词库」。' : '，本轮随机抽 '+Math.min(dm.n, avail)+' 个。')
    + '<br><br>默写结果会直接写进记忆曲线：默对按「记得」推进，默错按「忘了」回到 1 天后重来。</div>'
    + '<button class="btn primary" style="margin-top:14px'+(avail?"":";opacity:.5")+'" onclick="dmStart()">开始默写</button></div></div>';
  return h;
}
function setDmScope(v){ dm.scope = v; render(); }
function setDmN(v){ dm.n = Number(v); render(); }
function setDmMode(v){ dm.mode = v; render(); }
function toggleDmHint(){ dm.hint = !dm.hint; render(); }

function dmHintTxt(n){
  var s = n.charAt(0).toUpperCase();
  for(var i=1;i<n.length;i++) s += " _";
  return s;
}
function dmStart(){
  var pool = dmPool();
  if(!pool.length){ alert("这个范围里还没有可默写的词。先去学几个，或者换个范围。"); return; }
  shuffle(pool);
  dm.list = pool.slice(0, Math.min(dm.n, pool.length)).map(function(x){ return {w:x.w}; });
  dm.i = 0; dm.typed = ""; dm.answered = false; dm.right = false;
  dm.done = false; dm.wrong = []; dm.ok = 0; dm.open = true;
  render();
}
function dmQuit(){ dm.open = false; render(); }
function dmDiffHTML(u, t){
  u = norm(u); t = t.toLowerCase();
  var h = "";
  for(var i=0;i<t.length;i++){
    h += (u.charAt(i)===t.charAt(i)) ? '<span class="g">'+esc(t.charAt(i))+'</span>' : '<span class="b">'+esc(t.charAt(i))+'</span>';
  }
  if(u.length>t.length) h += '<span class="k">+'+esc(u.slice(t.length))+'</span>';
  return h;
}
function dmRecord(name, ok){
  var first = (st(name).times===0);
  grade(name, ok ? 4 : 1);
  var ds = dayStat();
  if(first) ds.neu++; else ds.rev++;
  if(ok) ds.ok++; else ds.bad++;
  save();
}
function dmSubmit(){
  if(!dm.open || dm.done || dm.answered) return;
  var el = document.getElementById("dmIn");
  dm.typed = el ? el.value : dm.typed;
  var name = dm.list[dm.i].w;
  dm.answered = true;
  dm.right = (norm(dm.typed) !== "" && norm(dm.typed) === norm(name));
  if(dm.right) dm.ok++; else dm.wrong.push({w:name, typed:dm.typed});
  dmRecord(name, dm.right);
  render();
}
function dmSkip(){
  if(!dm.open || dm.done || dm.answered) return;
  dm.typed = "";
  var name = dm.list[dm.i].w;
  dm.answered = true; dm.right = false;
  dm.wrong.push({w:name, typed:""});
  dmRecord(name, false);
  render();
}
function dmNext(){
  if(dm.i+1 >= dm.list.length){ dm.done = true; render(); return; }
  dm.i++; dm.typed = ""; dm.answered = false; dm.right = false; render();
}
function dmQHTML(){
  var name = dm.list[dm.i].w;
  var w = BY_W[name] || {w:name, ipa:"", cn:"", ex:"", excn:"", curated:false, tag:""};
  var total = dm.list.length, pct = Math.round(dm.i/total*100);
  var last = (dm.i+1>=total);
  var h = '<div class="dm-top"><span class="ct">第 '+(dm.i+1)+' / '+total+'</span>'
    + '<div class="dm-bar"><i style="width:'+pct+'%"></i></div>'
    + '<button style="border:0;background:none;color:var(--faint);font-family:inherit;font-size:12px;cursor:pointer" onclick="dmQuit()">退出</button></div>'
    + '<div class="dm-wrap"><div class="dm-card">';
  if(dm.mode==="cn"){
    h += '<div class="dm-cn">'+esc(w.cn || "（无释义）")+'</div>'
      + '<div class="dm-sub">'+name.length+' 个字母 · '+(w.curated ? w.topic : (tagLabel(w.tag)||"通用词库"))+'</div>';
  }else{
    h += '<button class="dm-bigplay" onclick="speakWord(\''+name+'\')">🔊</button>'
      + '<div class="dm-sub" style="margin-top:12px">听发音，写出整个单词 · '+name.length+' 个字母</div>';
  }
  if(dm.hint && !dm.answered) h += '<div class="dm-hint">'+esc(dmHintTxt(name))+'</div>';

  if(!dm.answered){
    h += '<input class="dm-inp" id="dmIn" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="在这里写出英文">'
      + '<div class="dm-act"><button onclick="dmSubmit()">提交（回车）</button><button onclick="dmSkip()">不会，看答案</button></div>';
  }else{
    h += '<div class="dm-diff">'+dmDiffHTML(dm.typed, name)+'</div>'
      + '<div class="dm-score"><b class="'+(dm.right?"ok":"no")+'">'+(dm.right ? "✓ 拼对了" : "✗ 这个拼写要再记一遍")+'</b>'
      + '<span>'+esc(name)+' · '+esc(w.ipa || "")+'</span></div>';
    if(!dm.right) h += '<div class="dm-note">你写的是：'+esc(dm.typed || "（空着没写）")+'</div>';
    if(w.ex) h += '<div class="ex-box" style="margin-top:16px;text-align:left"><p>'+exHi(w)+'</p><small>'+esc(w.excn)+'</small>'
      + '<button class="speak" style="margin-top:8px" onclick="speakSent(\''+jsq(w.ex)+'\')">🔊 整句朗读</button></div>';
    h += '<button class="btn primary" style="margin-top:16px" onclick="dmNext()">'+(last ? "看本轮结果" : "下一题")+'</button>';
  }
  h += '</div></div>';
  return h;
}
function dmSumHTML(){
  var total = dm.list.length, acc = total ? Math.round(dm.ok/total*100) : 0;
  var h = '<div class="dm-sum"><div class="dm-ring"><b>'+acc+'%</b><span>默写正确率</span></div>'
    + '<h2 style="margin:0 0 6px">'+(acc>=85 ? "拼写很稳" : acc>=60 ? "大体记住了" : "错得不少，明天再来一遍")+'</h2>'
    + '<p class="note">'+total+' 题 · 对 '+dm.ok+' · 错 '+(total-dm.ok)+'</p></div>';
  if(dm.wrong.length){
    h += '<div class="sec" style="padding:8px 20px 6px">写错的词</div><div class="dm-wrong">';
    dm.wrong.forEach(function(x){
      var w = BY_W[x.w] || {};
      h += '<div class="it"><div><b>'+esc(x.w)+'</b>'
        + '<div style="font-size:12px;color:var(--sub);margin-top:2px">'+esc(w.cn || "")+'</div></div>'
        + '<span>你写：'+esc(x.typed || "—")+'</span></div>';
    });
    h += '</div>';
  }
  h += '<div style="padding:16px">';
  if(dm.wrong.length) h += '<button class="btn primary" onclick="dmRetryWrong()">错词再默一遍</button>';
  h += '<div class="row" style="margin-top:10px">'
    + '<button class="btn ghost" style="flex:1" onclick="dm.open=false;resetDm();render()">重新设置</button>'
    + '<button class="btn ghost" style="flex:1" onclick="dm.open=false;resetDm();go(\'home\')">回首页</button></div></div>';
  return h;
}
function resetDm(){ dm.list = []; dm.i = 0; dm.typed = ""; dm.answered = false; dm.right = false; dm.done = false; dm.wrong = []; dm.ok = 0; }
function dmRetryWrong(){
  dm.list = dm.wrong.map(function(x){ return {w:x.w}; });
  dm.i = 0; dm.typed = ""; dm.answered = false; dm.right = false;
  dm.done = false; dm.wrong = []; dm.ok = 0;
  render();
}
function renderDict(){
  if(!dm.open) return renderDmSetup();
  if(!dm.list.length) return renderDmSetup();
  return dm.done ? dmSumHTML() : dmQHTML();
}

/* =============== 整句阅读 =============== */
var rd = {idx:0, mode:"focus", filter:"all", loop:false, play:false, seq:0, open:{}};
function jsq(s){ return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }

function allSent(){ return CORE.filter(function(x){ return x.ex; }); }
function readList(){
  var out = allSent();
  if(rd.filter==="工程") out = out.filter(function(x){ return x.topic==="工程"; });
  else if(rd.filter==="日常") out = out.filter(function(x){ return x.topic!=="工程"; });
  else if(rd.filter==="未读") out = out.filter(function(x){ return !S.readDone[x.w]; });
  return out;
}
function rdHi(w){
  try{
    var re = new RegExp(w.w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi");
    return esc(w.ex).replace(re, function(m){ return '<em>'+m+'</em>'; });
  }catch(e){ return esc(w.ex); }
}
function rdDone(){ return allSent().filter(function(x){ return S.readDone[x.w]; }).length; }
function setRdFilter(v){ rd.filter = v; rd.idx = 0; render(); }
function setRdMode(v){ rd.mode = v; render(); }
function rdReveal(k){ rd.open[k] = true; render(); }

function rdSay(slow){
  var list = readList(), w = list[rd.idx];
  if(!w) return;
  rd.seq = (rd.seq||0)+1;
  var me = rd.seq, rate = slow ? 0.62 : (S.set.rate || 0.9);
  tts(w.ex, rate, function(){
    if(rd.loop && rd.seq===me) setTimeout(function(){ if(rd.seq===me) rdSay(slow); }, 350);
  });
}
function rdLoop(){
  rd.loop = !rd.loop;
  render();
  if(rd.loop) rdSay(false);
  else { try{ speechSynthesis.cancel(); }catch(e){} }
}
function rdMark(k){
  if(S.readDone[k]) delete S.readDone[k];
  else S.readDone[k] = 1;
  save(); render();
}
function rdPrev(){ if(rd.idx>0){ rd.idx--; render(); } }
function rdNext(){
  var list = readList();
  if(rd.idx < list.length-1){
    var w = list[rd.idx];
    if(w && !S.readDone[w.w]){ S.readDone[w.w] = 1; save(); }
    rd.idx++; render();
  }else{
    alert("这一类句子已经到最后一句了。可以切回「全部」再看一遍，或者去默写。");
  }
}
function rdFocus(i){ rd.idx = i; rd.mode = "focus"; render(); }

function rdPlayAll(){
  var list = readList();
  if(!list.length) return;
  rd.play = true; rd.pi = 0; rdChain(list);
}
function rdChain(list){
  if(!rd.play) return;
  if(rd.pi >= list.length){ rd.play = false; render(); return; }
  var w = list[rd.pi], el = document.getElementById("rdShadow");
  if(el) el.innerHTML = "正在连读：第 "+(rd.pi+1)+" / "+list.length+" 句";
  tts(w.ex, S.set.rate || 0.9, function(){
    rd.pi++;
    setTimeout(function(){ rdChain(list); }, 600);
  });
}
function rdStopAll(){ rd.play = false; try{ speechSynthesis.cancel(); }catch(e){} render(); }

function rdShadow(){
  var w = readList()[rd.idx];
  if(!w) return;
  var el = document.getElementById("rdShadow");
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    var ua = (typeof navigator !== "undefined" && navigator.userAgent) || "";
    var isIOS = /iPhone|iPad|iPod/.test(ua);
    if(el) el.innerHTML = isIOS
      ? "iPhone 的 Safari 不支持网页语音识别。这样练就行：点「慢速」听两遍 → 自己大声跟读 → 再点「整句」对比语气。"
      : "这个浏览器不支持语音识别。可以先点「慢速」听两遍，再自己大声读一遍整句。";
    return;
  }
  if(el) el.innerHTML = "🎤 请把整句读一遍，读完自动比对…";
  try{
    var r = new SR();
    r.lang = "en-US"; r.interimResults = false; r.maxAlternatives = 1;
    r.onresult = function(e){
      var said = e.results[0][0].transcript;
      var a = said.toLowerCase().match(/[a-z']+/g) || [];
      var b = w.ex.toLowerCase().match(/[a-z']+/g) || [];
      var miss = b.filter(function(x){ return a.indexOf(x)<0; });
      var pct = b.length ? Math.round((b.length-miss.length)/b.length*100) : 0;
      if(el) el.innerHTML = '听清 '+pct+'%'+(miss.length ? ' · 漏读：<span style="color:var(--red)">'+esc(miss.join(" "))+'</span>' : ' · 整句读得很完整 ✓')
        + '<br><span style="opacity:.6">识别结果：'+esc(said)+'</span>';
      if(pct>=85){ S.readDone[w.w] = 1; save(); }
    };
    r.onerror = function(){
      if(el) el.innerHTML = "没听清（麦克风权限未开或环境太吵）。先点「慢速」听一遍，再说。";
    };
    r.start();
    setTimeout(function(){ try{ r.stop(); }catch(e){} }, 7000);
  }catch(e){
    if(el) el.innerHTML = "语音识别启动失败：" + (e && e.message ? e.message : "未知原因");
  }
}

function rdCard(w, big, i){
  var h = '<div class="rd-card">'
    + '<p class="rd-en" style="font-size:'+(big?"18.5px":"16px")+'">'+rdHi(w)+'</p>'
    + '<div class="rd-cn'+(rd.open[w.w]?"":" blur")+'" onclick="rdReveal(\''+w.w+'\')">'+esc(w.excn)+'</div>'
    + '<div class="rd-tools">'
    + '<button onclick="speakSent(\''+jsq(w.ex)+'\')">🔊 整句</button>';
  if(big){
    h += '<button onclick="speakSent(\''+jsq(w.ex)+'\',true)">🐢 慢速</button>'
      + '<button class="'+(rd.loop?"on":"")+'" onclick="rdLoop()">🔁 循环</button>'
      + '<button onclick="rdShadow()">🎤 跟读</button>';
  }
  h += '<button class="'+(S.readDone[w.w]?"on":"")+'" onclick="rdMark(\''+w.w+'\')">'+(S.readDone[w.w] ? "✓ 已读" : "标记已读")+'</button>';
  if(!big && i!==undefined) h += '<button onclick="rdFocus('+i+')">单句精读</button>';
  h += '</div>';
  if(big) h += '<div class="rd-shadow" id="rdShadow">先听整句 → 再看中文 → 最后大声跟读一遍</div>';
  h += '</div>';
  return h;
}

function renderRead(){
  var list = readList();
  var total = allSent().length, done = rdDone();
  if(rd.idx >= list.length) rd.idx = Math.max(0, list.length-1);

  var h = '<div class="rd-head"><h2>整句阅读</h2>'
    + '<p>不是逐词背，是把整句读顺：听整句 → 看中文 → 跟读。句子熟了，词才会用。</p>'
    + '<div style="display:flex;align-items:center;gap:10px;margin-top:12px">'
    + '<div class="dm-bar" style="flex:1"><i style="width:'+Math.round(done/total*100)+'%"></i></div>'
    + '<span style="font-size:12px;color:var(--faint);white-space:nowrap">已读 '+done+' / '+total+' 句</span></div>'
    + '<div class="segtabs" style="margin-top:12px">'
    + [["all","全部"],["工程","工程"],["日常","日常"],["未读","未读"]].map(function(o){
        return '<button class="'+(rd.filter===o[0]?"on":"")+'" onclick="setRdFilter(\''+o[0]+'\')">'+o[1]+'</button>';
      }).join("")
    + '</div></div>';

  h += '<div class="dm-wrap" style="padding-bottom:6px"><div class="dm-opts" style="justify-content:flex-start">'
    + '<button class="'+(rd.mode==="focus"?"on":"")+'" onclick="setRdMode(\'focus\')">逐句精读</button>'
    + '<button class="'+(rd.mode==="all"?"on":"")+'" onclick="setRdMode(\'all\')">全部句子</button>'
    + '<button onclick="'+(rd.play?"rdStopAll()":"rdPlayAll()")+'">'+(rd.play?"⏹ 停止连读":"▶ 连读这一类")+'</button>'
    + '</div></div>';

  if(!list.length){
    h += '<div class="rd-card"><div class="note">这一类暂时没有句子了。点「全部」看所有例句，或者去首页学新词。</div></div>';
    return h;
  }

  if(rd.mode==="focus"){
    var w = list[rd.idx];
    h += rdCard(w, true);
    h += '<div class="dm-wrap" style="padding:0 16px"><div class="dm-act">'
      + '<button onclick="rdPrev()"'+(rd.idx===0?" disabled style=\"opacity:.45\"":"")+'>← 上一句</button>'
      + '<button onclick="rdNext()">下一句 →</button></div>'
      + '<div class="note" style="margin:14px 0 18px">第 '+(rd.idx+1)+' / '+list.length+' 句 · 目标词 <b>'+esc(w.w)+'</b> · '+esc(w.cn)+'</div></div>';
  }else{
    h += '<div style="height:8px"></div>';
    list.forEach(function(x, i){ h += rdCard(x, false, i); });
    h += '<div style="height:14px"></div>';
  }

  h += '<div class="note" style="padding:0 20px 20px">'
    + '这 '+total+' 句都来自精讲词的真实例句（工程 + 日常）。大词库的 5 万词暂时只带释义，没有例句，所以这里读不到它们的句子 —— 想练更多句子，可以在词库里把词「加入今日学习」，学完会进到复习队列。'
    + '</div>';
  return h;
}

/* =============== 启动 =============== */
document.querySelectorAll(".tb").forEach(function(b){
  b.addEventListener("click", function(){
    go(b.getAttribute("data-tab"));
  });
});

function go(t){
  tab = t;
  document.querySelectorAll(".tb").forEach(function(x){
    x.classList.toggle("active", x.getAttribute("data-tab")===t);
  });
  if(t==="home" && sess){ exitSession(); }
  render();
}

function render(){
  var v = document.getElementById("view");
  if(tab==="home") v.innerHTML = renderHome();
  else if(tab==="dict") v.innerHTML = renderDict();
  else if(tab==="read") v.innerHTML = renderRead();
  else if(tab==="bank") v.innerHTML = renderBank();
  else v.innerHTML = renderMe();
  v.scrollTop = 0;
  if(tab==="dict" && dm.open && !dm.done && dm.list.length){
    var inp = document.getElementById("dmIn");
    if(inp){
      inp.value = dm.typed || "";
      inp.addEventListener("keydown", function(e){
        if(e.key==="Enter"){ e.preventDefault(); dmSubmit(); }
      });
      try{ inp.focus(); }catch(e){}
    }
  }
}

window.addEventListener("resize", function(){ if(tab==="bank" && bankMode==="word") render(); });

render();
</script>
</body>
</html>
